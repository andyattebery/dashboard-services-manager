---
name: update-flake

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.1.0 or v1.1.0)'
        required: true

permissions:
  contents: write

# Split into three jobs so the bumped package is proven to build on EVERY platform it claims
# before the commit exists.
#
# It has to be done here rather than by letting ci.yaml react to the push: a commit pushed with
# the repository's GITHUB_TOKEN does not trigger `on: push` workflows. GitHub blocks that to
# prevent recursion, independently of [skip ci]. Measured -- commit 1cd8dad carried no skip flag
# and still produced zero workflow runs. So a bad hash caught "later by CI" would never be
# caught at all.
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Rewrite nix/package.nix for the new release
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          # passthru.updateScript wraps nixpkgs' update-source-version, which rewrites the
          # version and one hash per platform, iterating meta.platforms. It replaces hashes by
          # VALUE and refuses to act if the old hash is not unique in the file, so there is no
          # dependence on formatting and no way for a substitution to silently match nothing.
          #
          # It must run from the repository root: update-source-version evaluates `import ./.`,
          # which is why default.nix exists.
          #
          # default.nix resolves nixpkgs from flake.lock, NOT from <nixpkgs>. install-nix-action
          # runs the installer with --no-channel-add and does not set NIX_PATH, so `import
          # <nixpkgs>` fails outright here with "file 'nixpkgs' was not found in the Nix search
          # path". That is what broke the 1.2.8 run.
          "$(nix-build --no-out-link -A dsm-provider.updateScript)" "$VERSION"

          git diff --stat nix/package.nix

          # A no-op means the dispatch fired for a version already recorded, or that the
          # updater matched nothing. Stop rather than run three verify jobs and an empty
          # commit. (update-source-version dies on its own if a hash is not uniquely
          # locatable, but it updates platforms one at a time, so a mid-loop failure can
          # leave the file PARTIALLY updated -- measured. The verify matrix is what catches
          # that: the un-updated platform's hash will not match its new URL.)
          if git diff --quiet nix/package.nix; then
            echo "::error::nix/package.nix unchanged -- already at ${{ inputs.tag }}?"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: package-nix
          path: nix/package.nix
          if-no-files-found: error

  verify:
    needs: prepare
    # Every platform nix/package.nix claims. Native runners, no QEMU: ubuntu-24.04-arm and
    # macos-latest are real hardware, and standard runners are free and unlimited on public
    # repositories. They run concurrently, so this costs wall-clock only for the slowest leg.
    #
    # This is the only place the aarch64-darwin and aarch64-linux binaries are ever executed --
    # the package's installCheckPhase runs the binary, and that cannot happen on a foreign
    # architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      # Downloaded to a scratch directory and moved into place explicitly, rather than
      # extracted over the checkout. Writing an artifact on top of a file that already exists
      # depends on the action's overwrite behaviour; moving it does not, and a missing
      # artifact fails here instead of silently leaving the committed file in place -- which
      # would make this job verify the OLD package and pass.
      - uses: actions/download-artifact@v8
        with:
          name: package-nix
          path: artifact
      - name: Apply the updated package.nix
        run: |
          set -euo pipefail
          test -f artifact/package.nix
          mv artifact/package.nix nix/package.nix
          rmdir artifact
          if git diff --quiet nix/package.nix; then
            echo "::error::artifact is identical to the committed nix/package.nix -- nothing would be verified"
            exit 1
          fi
          git --no-pager diff --stat nix/package.nix
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      # `nix` reads the working tree for a git repo, so the uncommitted change above IS what
      # gets evaluated -- verified locally by planting a wrong hash and watching the build
      # fail on it.
      #
      # Both steps are needed and they check different things. `flake check` builds `checks`,
      # which is the module regression test; it does NOT look at the package hashes -- a bad
      # hash passes it. `nix build` is what fetches the tarball (proving the hash) and runs
      # installCheckPhase (proving the binary starts on this architecture).
      - run: nix flake check
      - run: nix build .#packages.${{ matrix.system }}.dsm-provider

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: package-nix
          path: artifact
      - name: Commit and push
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          # Same explicit move as in verify: never rely on an artifact being extracted over an
          # existing file. This is the commit that ships, so a silent no-op here would push
          # the unchanged package while the release moved on.
          test -f artifact/package.nix
          mv artifact/package.nix nix/package.nix
          rmdir artifact

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet nix/package.nix; then
            echo "::error::nix/package.nix matches HEAD -- refusing to create an empty commit"
            exit 1
          fi
          git add nix/package.nix
          # No [skip ci]: this push cannot trigger a workflow anyway (GITHUB_TOKEN rule, see the
          # comment at the top). The flag only ever advertised an intent that had no effect.
          # What validates this commit is the verify matrix above, which has already passed.
          git commit -m "update flake to $VERSION"
          git push
